/* ============ 2. KERN ============ */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const ease = t => { t = clamp(t, 0, 1); return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; };
const easeOut = t => { t = clamp(t, 0, 1); return 1 - (1 - t) * (1 - t); };
function seeded(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hit = (p, x, y, r) => (p.x - x) * (p.x - x) + (p.y - y) * (p.y - y) <= r * r;

/* ---- Ansicht: virtuelle Höhe 540, Breite je nach Bildschirm ---- */
const VH = 540;
let VW = 960;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const View = {
  scale: 1, dpr: 1, ox: 0, oy: 0, portrait: false, btn: 100,
  resize() {
    const w = window.innerWidth || 960, h = window.innerHeight || 540;
    this.dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    canvas.width = Math.round(w * this.dpr); canvas.height = Math.round(h * this.dpr);
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    this.portrait = h > w * 1.05;
    VW = Math.round(VH * clamp(w / h, 4 / 3, 2.4));
    this.scale = Math.min(canvas.width / VW, canvas.height / VH);
    this.ox = (canvas.width - VW * this.scale) / 2; this.oy = (canvas.height - VH * this.scale) / 2;
    // Knopfgröße (Durchmesser in virtuellen Einheiten), damit es auf dem Handy mind. ~74 CSS-Pixel sind
    this.btn = clamp(74 / (this.scale / this.dpr), 96, 150);
    if (Game.scene && Game.scene.resize) Game.scene.resize();
  },
  toV(cx, cy) { return { x: (cx * this.dpr - this.ox) / this.scale, y: (cy * this.dpr - this.oy) / this.scale }; }
};

function goFullscreen() {
  try {
    const el = document.documentElement;
    if (!document.fullscreenElement && el.requestFullscreen) {
      const pr = el.requestFullscreen({ navigationUI: 'hide' });
      if (pr && pr.then) pr.then(() => { try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => {}); } catch (e) {} }).catch(() => {});
    }
  } catch (e) {}
}

/* ---- Eingabe: Finger, Maus, Tastatur ---- */
const Input = { pointers: new Map(), keys: new Set() };
function initInput() {
  const mk = e => { const v = View.toV(e.clientX, e.clientY); return { id: e.pointerId, x: v.x, y: v.y, sx: v.x, sy: v.y, t0: Game.time, type: e.pointerType || 'mouse' }; };
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault(); Sfx.unlock();
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    const p = mk(e); Input.pointers.set(p.id, p);
    if (p.type === 'touch' && Game.scene !== StartScene) goFullscreen();
    Game.down(p);
  });
  canvas.addEventListener('pointermove', e => {
    const p = Input.pointers.get(e.pointerId); if (!p) return;
    const v = View.toV(e.clientX, e.clientY); p.x = v.x; p.y = v.y; Game.move(p);
  });
  const end = e => { const p = Input.pointers.get(e.pointerId); if (!p) return; const v = View.toV(e.clientX, e.clientY); p.x = v.x; p.y = v.y; Input.pointers.delete(e.pointerId); Game.up(p); };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('keydown', e => {
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
    if (e.repeat) return;
    Sfx.unlock(); Input.keys.add(e.code); Game.key(e.code);
  });
  window.addEventListener('keyup', e => Input.keys.delete(e.code));
  window.addEventListener('blur', () => { Input.keys.clear(); Input.pointers.clear(); });
}

/* ---- Töne (Web Audio, alles erzeugt, keine Dateien) ---- */
const Sfx = {
  ac: null, master: null,
  unlock() {
    try {
      if (!this.ac) {
        const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
        this.ac = new AC(); this.master = this.ac.createGain(); this.master.gain.value = 0.55; this.master.connect(this.ac.destination);
      }
      if (this.ac.state === 'suspended') this.ac.resume();
    } catch (e) { this.ac = null; }
  },
  tone(f, d, o = {}) {
    if (!this.ac) return;
    try {
      const ac = this.ac, t0 = ac.currentTime + (o.at || 0), osc = ac.createOscillator(), g = ac.createGain();
      osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(f, t0);
      if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t0 + d);
      const v = o.vol == null ? 0.25 : o.vol;
      g.gain.setValueAtTime(0.0001, t0); g.gain.linearRampToValueAtTime(v, t0 + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
      osc.connect(g); g.connect(this.master); osc.start(t0); osc.stop(t0 + d + 0.05);
    } catch (e) {}
  },
  noise(d, o = {}) {
    if (!this.ac) return;
    try {
      const ac = this.ac, t0 = ac.currentTime + (o.at || 0), n = Math.floor(ac.sampleRate * d);
      const buf = ac.createBuffer(1, n, ac.sampleRate), ch = buf.getChannelData(0);
      for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n);
      const src = ac.createBufferSource(); src.buffer = buf;
      const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = o.freq || 2000;
      const g = ac.createGain(); g.gain.value = o.vol || 0.2;
      src.connect(f); f.connect(g); g.connect(this.master); src.start(t0);
    } catch (e) {}
  },
  play(name, arg) { const f = SOUNDS[name]; if (f) f(this, arg); }
};
const SOUNDS = {

  pop: s => s.tone(420, 0.12, { to: 880, vol: 0.25 }),

  fanfare: s => { [523, 523, 659, 784, 659, 784, 1047, 1047, 1319].forEach((f, i) => s.tone(f, 0.24, { type: 'triangle', vol: 0.24, at: i * 0.15 })); [262, 330, 392].forEach(f => s.tone(f, 1.4, { vol: 0.1, at: 0.9 })); },
  jump: s => s.tone(380, 0.18, { to: 760, vol: 0.2 }),
  land: s => s.tone(160, 0.06, { vol: 0.15 }),
  star: s => { s.tone(1047, 0.1, { type: 'triangle', vol: 0.2 }); s.tone(1568, 0.18, { type: 'triangle', vol: 0.2, at: 0.08 }); },
  crystal: s => [784, 988, 1175, 1568].forEach((f, i) => s.tone(f, 0.25, { vol: 0.18, at: i * 0.07 })),
  giggle: s => { for (let i = 0; i < 6; i++) s.tone(700 + (i % 2) * 220 + i * 30, 0.07, { type: 'square', vol: 0.06, at: i * 0.085 }); },
  hint: s => { s.tone(880, 0.12, { vol: 0.15 }); s.tone(1175, 0.2, { vol: 0.15, at: 0.12 }); },
  whoosh: s => s.noise(0.4, { vol: 0.22, freq: 800 }),
  hop: s => s.tone(520, 0.1, { to: 700, vol: 0.12 }),
  babble: s => { for (let i = 0; i < 5; i++) s.tone(400 + Math.random() * 300, 0.09, { type: 'triangle', vol: 0.12, at: i * 0.11 }); },
  quak: s => { s.tone(220, 0.12, { to: 160, type: 'sawtooth', vol: 0.1 }); s.tone(240, 0.14, { to: 150, type: 'sawtooth', vol: 0.1, at: 0.16 }); },
  huhu: s => { s.tone(392, 0.2, { vol: 0.2 }); s.tone(330, 0.35, { vol: 0.2, at: 0.24 }); },
  note: (s, f) => s.tone(f, 0.25, { type: 'triangle', vol: 0.22 })

/* ---- Sprache: Aufnahme (falls eingetragen) -> Computerstimme -> freundliches Gebrabbel ---- */
const Voice = {
  synth: null, voice: null, hasList: false, last: null, audioEl: null,
  init() {
    try {
      this.synth = window.speechSynthesis || null; if (!this.synth) return;
      const choose = () => {
        try {
          const vs = this.synth.getVoices() || []; this.hasList = vs.length > 0;
          this.voice = vs.find(v => /^de[-_]DE/i.test(v.lang) && v.localService) || vs.find(v => /^de[-_]DE/i.test(v.lang)) || vs.find(v => /^de/i.test(v.lang)) || null;
        } catch (e) {}
      };
      choose();
      if (this.synth.addEventListener) this.synth.addEventListener('voiceschanged', choose); else this.synth.onvoiceschanged = choose;
    } catch (e) { this.synth = null; }
  },
  say(key, o = {}) {
    const e = SPEECH[key]; if (!e) return;
    this.last = key;
    if (!CONFIG.speech.enabled) return;
    let txt = Array.isArray(e.text) ? pick(e.text) : e.text;
    txt = txt.replace(/\{name\}/g, Save.data.name || 'dein Einhorn');
    if (e.audio) {
      try {
        this.stop(); const a = new Audio(e.audio); this.audioEl = a;
        const pr = a.play(); if (pr && pr.catch) pr.catch(() => this.tts(txt, o));
        return;
      } catch (err) {}
    }
    this.tts(txt, o);
  },
  tts(txt, o) {
    try {
      // Keine Sprachausgabe oder sicher keine deutsche Stimme: Gebrabbel statt falscher Aussprache
      if (!this.synth || typeof SpeechSynthesisUtterance === 'undefined' || (this.hasList && !this.voice)) { Sfx.play('babble'); return; }
      if (!o.queue) this.synth.cancel();
      const u = new SpeechSynthesisUtterance(txt);
      u.lang = CONFIG.speech.lang; if (this.voice) u.voice = this.voice;
      u.rate = CONFIG.speech.rate; u.pitch = o.pitch || CONFIG.speech.pitch;
      this.synth.speak(u);
    } catch (e) { Sfx.play('babble'); }
  },
  stop() { try { if (this.synth) this.synth.cancel(); if (this.audioEl) { this.audioEl.pause(); this.audioEl = null; } } catch (e) {} }
};

/* ---- Spielstand ---- */
const Save = {
  data: null,
  fresh() { return { name: null, nameId: null, crystals: { owl: false, fox: false, frog: false, dragon: false }, level: { owl: 0, fox: 0, frog: 0, dragon: 0 }, goldParty: false, party4: false, goldParty4: false, dragonFriend: false, stars: [], rideTold: false, worldV: 0, dragon: { state: 'waiting', x: 0, y: 0, who: null }, celebrated: false, pos: null }; },
  load() {
    this.data = this.fresh();
    try {
      const raw = window.localStorage.getItem(CONFIG.saveKey);
      if (raw) { const d = JSON.parse(raw); if (d && typeof d === 'object') { Object.assign(this.data, d); this.data.crystals = Object.assign(this.fresh().crystals, d.crystals || {}); this.data.dragon = Object.assign(this.fresh().dragon, d.dragon || {}); this.data.level = Object.assign(this.fresh().level, d.level || {}); for (const k in this.data.crystals) if (this.data.crystals[k] && !this.data.level[k]) this.data.level[k] = 1; if (!Array.isArray(this.data.stars)) this.data.stars = []; } }
    } catch (e) {}
  },

/* ---- Effekte: Glitzer, Konfetti ---- */
const PASTEL = ['#ff9ecb', '#ffd27f', '#9be7c4', '#9ecbff', '#c9a5ff', '#fff38a'];
class Fx {
  constructor() { this.p = []; }
  add(o) { if (this.p.length > 400) return; this.p.push(Object.assign({ x: 0, y: 0, vx: 0, vy: 0, g: 0, life: 1, max: 1, size: 8, color: '#fff', shape: 'star', rot: 0, vr: 0 }, o, { max: o.life || 1 })); }
  burst(x, y, n, o = {}) {
    for (let i = 0; i < n; i++) {
      const a = rnd(TAU), sp = rnd(o.sp0 || 60, o.sp1 || 260);
      this.add({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (o.up || 0), g: o.g == null ? 300 : o.g, life: rnd(0.5, o.life || 1.1), size: rnd(o.s0 || 5, o.s1 || 12), color: o.color || pick(PASTEL), shape: o.shape || 'star', rot: rnd(TAU), vr: rnd(-6, 6) });
    }
  }
  confetti(w, n = 60) {
    for (let i = 0; i < n; i++) this.add({ x: rnd(w), y: rnd(-80, -10), vx: rnd(-40, 40), vy: rnd(120, 300), g: 60, life: rnd(2, 3.4), size: rnd(7, 13), color: pick(PASTEL), shape: pick(['rect', 'star', 'dot', 'heart']), rot: rnd(TAU), vr: rnd(-8, 8) });
  }
  update(dt) {
    const p = this.p;
    for (let i = p.length - 1; i >= 0; i--) { const q = p[i]; q.life -= dt; if (q.life <= 0) { p[i] = p[p.length - 1]; p.pop(); continue; } q.vy += q.g * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.rot += q.vr * dt; }
  }
  draw(c) {
    for (const q of this.p) {
      c.save(); c.globalAlpha = clamp(q.life / q.max * 1.6, 0, 1); c.translate(q.x, q.y); c.rotate(q.rot); c.fillStyle = q.color;
      if (q.shape === 'star') { sparklePath(c, 0, 0, q.size); c.fill(); }
      else if (q.shape === 'rect') c.fillRect(-q.size / 2, -q.size / 3, q.size, q.size * 0.66);
      else if (q.shape === 'heart') { heartPath(c, 0, 0, q.size); c.fill(); }
      else { c.beginPath(); c.arc(0, 0, q.size / 2, 0, TAU); c.fill(); }
      c.restore();
    }
  }
}
const ScreenFx = new Fx();

/* ---- Szenen-Verwaltung: Game.go(Szene, Optionen) blendet weich um ---- */
const Game = {
  scene: null, pending: null, fade: 1, time: 0,
  go(scene, opts) { if (this.pending) return; this.pending = { scene, opts: opts || {} }; },
  update(dt) {
    this.time += dt;
    if (this.pending) {
      this.fade += dt * 4;
      if (this.fade >= 1) { this.fade = 1; const p = this.pending; this.pending = null; if (this.scene && this.scene.leave) this.scene.leave(); this.scene = p.scene; this.scene.enter(p.opts); }
    } else if (this.fade > 0) this.fade = Math.max(0, this.fade - dt * 3);
    if (this.scene) this.scene.update(dt);
    ScreenFx.update(dt);
  },
  draw(c) {
    if (this.scene) this.scene.draw(c);
    ScreenFx.draw(c);
    if (this.fade > 0) { c.globalAlpha = this.fade; c.fillStyle = '#fff8ee'; c.fillRect(0, 0, VW, VH); c.globalAlpha = 1; }
  },
  ok() { return !this.pending && !View.portrait && this.scene; },
  down(p) { if (this.ok() && this.scene.down) this.scene.down(p); },
  move(p) { if (this.ok() && this.scene.move) this.scene.move(p); },
  up(p) { if (this.ok() && this.scene.up) this.scene.up(p); },
  key(k) { if (this.ok() && this.scene.key) this.scene.key(k); }
};

const StartScene = {
  enter() { this.t = 0; this.hold = null; this.holdT = 0; this.flash = 0; this.panel = false; this.armed = -1; },
  btn() { return { x: VW / 2, y: VH * 0.5, r: Math.max(View.btn * 0.8, 92) }; },
  gear() { return { x: VW - 46, y: VH - 46, r: 28 }; },
  // Eltern-Bereich: 0 = Kristalle neu sammeln, 1 = alles neu, 2 = zurück
  panelBtns() {
    const r = Math.max(View.btn / 2, 56), sp = Math.min(240, (VW - 150) / 2.5), y = VH / 2 - 6;
    return [{ x: VW / 2 - sp, y, r, color: '#b79cff', label: 'Kristalle neu sammeln', sub: 'Der Name bleibt' }, { x: VW / 2, y, r, color: '#ff8fb1', label: 'Alles neu', sub: 'Auch der Name' }, { x: VW / 2 + sp, y, r, color: '#9ecbff', label: 'Zurück', sub: '' }];
  },
  update(dt) {
    this.t += dt;
    if (this.hold != null) { this.holdT += dt; if (this.holdT > 1.5) { this.hold = null; this.panel = true; this.armed = -1; Sfx.play('pop'); } }
    if (this.flash > 0) this.flash -= dt;

  },
  draw(c) {

    drawRoundBtn(c, b.x, b.y, b.r, { color: '#5fd38d', icon: 'play', pulse: !this.panel });
    const g = this.gear();
    c.globalAlpha = 0.6; c.fillStyle = '#fff'; circ(c, g.x, g.y, g.r); c.fill(); c.fillStyle = '#7a8a9a'; for (let i = 0; i < 3; i++) { circ(c, g.x - 10 + i * 10, g.y, 3); c.fill(); } c.globalAlpha = 1;
    if (this.hold != null) { c.strokeStyle = '#ff8fb1'; c.lineWidth = 6; c.lineCap = 'round'; c.beginPath(); c.arc(g.x, g.y, g.r + 6, -Math.PI / 2, -Math.PI / 2 + TAU * this.holdT / 1.5); c.stroke(); }
    if (this.panel) {
      c.fillStyle = 'rgba(40,40,70,0.55)'; c.fillRect(0, 0, VW, VH);

      B.forEach((q, i) => {
        const arm = this.armed === i;

        c.fillStyle = '#8a7aa8'; c.font = '500 16px system-ui, sans-serif'; if (!arm && q.sub) c.fillText(q.sub, q.x, q.y + q.r + 52);
      });
      c.textAlign = 'left'; c.textBaseline = 'alphabetic';
    }
    if (this.flash > 0) { c.fillStyle = 'rgba(255,255,255,' + clamp(this.flash, 0, 1) * 0.8 + ')'; c.fillRect(0, 0, VW, VH); }
  },
  down(p) {
    if (this.panel) {
      const B = this.panelBtns(), i = B.findIndex(q => hit(p, q.x, q.y, q.r + 10));

      if (this.armed !== i) { this.armed = i; Sfx.play('tap'); return; }

  },
  up(p) { if (this.hold === p.id) this.hold = null; },
  key(k) { if (this.panel) { if (k === 'Escape') this.panel = false; return; } if (k === 'Enter' || k === 'Space') this.start(null); },
  start(p) {
    Sfx.play('pop'); if (p && p.type === 'touch') goFullscreen();
    if (Save.data.name) Game.go(World, { back: true }); else Game.go(NamingScene, {});

};

const NamingScene = {
  enter() { this.t = 0; this.sel = -1; this.done = -1; this.idle = 0; this.hop = 0; this.said = false; this.toldConfirm = false; this.hintT = 0; },
  layout() {
    const r = Math.max(View.btn / 2 + 6, 58), sp = Math.min(190, (VW - 60) / 4);
    return { r, btns: NAMES.map((n, i) => ({ x: VW / 2 + (i - 1.5) * sp, y: VH - r - 22 })), ok: { x: Math.min(VW - 110, VW / 2 + 250), y: 215, r: Math.max(View.btn / 2 + 4, 56) }, uni: { x: VW / 2 - 10, y: 330 } };
  },
  update(dt) {
    this.t += dt; if (this.hop > 0) this.hop -= dt * 2; if (this.hintT > 0) this.hintT -= dt;
    if (!this.said && this.t > 1.1) { this.said = true; Voice.say('name_intro'); }
    if (this.done >= 0) { this.done += dt; if (this.done > 3.2) Game.go(World, { first: true }); return; }
    this.idle += dt;
    if (this.idle > CONFIG.hintDelay) { this.idle = 0; this.hintT = 4; Sfx.play('hint'); Voice.say(this.sel >= 0 ? 'name_confirm' : 'name_intro'); }
  },
  draw(c) {
    drawMeadow(c, this.t);
    const L = this.layout(), enter = easeOut(this.t / 1.1);
    const ux = lerp(-140, L.uni.x, enter), lift = Math.sin(clamp(this.hop, 0, 1) * Math.PI) * 40 + (enter < 1 ? Math.abs(Math.sin(this.t * 9)) * 16 : 0) + (this.done >= 0 ? Math.abs(Math.sin(this.done * 7)) * 30 : 0);
    drawActor(c, 't', L.uni.x - 210 < 70 ? 70 : L.uni.x - 210, 345, { size: 125, t: this.t });
    drawActor(c, 'unicorn', ux, L.uni.y, { size: 215, t: this.t, lift, walk: enter < 1, mark: this.sel >= 0 ? NAMES[this.sel].icon : null, glow: this.done >= 0 });
    NAMES.forEach((n, i) => {
      const b = L.btns[i], on = this.sel === i, wig = this.hintT > 0 && this.sel < 0 ? Math.max(0, Math.sin(this.t * 6 - i * 0.9)) * 9 : 0;
      if (on) { c.fillStyle = 'rgba(255,255,255,0.7)'; circ(c, b.x, b.y, L.r + 12); c.fill(); }
      drawRoundBtn(c, b.x, b.y - wig, L.r * (on ? 1.08 : 1), { color: n.color, stroke: on ? '#ff8fb1' : '#fff', icon: n.icon, iconScale: 1.15 });
    });
    if (this.sel >= 0 && this.done < 0) drawRoundBtn(c, L.ok.x, L.ok.y, L.ok.r, { color: '#5fd38d', icon: 'check', pulse: true, glow: this.hintT > 0 });
  },
  down(p) {
    if (this.done >= 0 || this.t < 0.6) return;
    this.idle = 0; this.hintT = 0;
    const L = this.layout();
    for (let i = 0; i < NAMES.length; i++) if (hit(p, L.btns[i].x, L.btns[i].y, L.r + 8)) {
      this.sel = i; this.hop = 1; Sfx.play('pop'); Voice.say('name_' + NAMES[i].id);
      ScreenFx.burst(L.btns[i].x, L.btns[i].y, 10, { g: 100 });
      if (!this.toldConfirm) { this.toldConfirm = true; Voice.say('name_confirm', { queue: true }); }
      return;
    }
    if (this.sel >= 0 && hit(p, L.ok.x, L.ok.y, L.ok.r + 10)) this.confirm();
    else if (hit(p, L.uni.x, L.uni.y - 110, 110)) { this.hop = 1; Sfx.play('hop'); }
  },
  key(k) {
    if (this.done >= 0) return;
    const n = { Digit1: 0, Digit2: 1, Digit3: 2, Digit4: 3 }[k];
    if (n != null) { this.sel = n; this.hop = 1; Sfx.play('pop'); Voice.say('name_' + NAMES[n].id); }
    if ((k === 'Enter' || k === 'Space') && this.sel >= 0) this.confirm();
  },
  confirm() {
    const n = NAMES[this.sel]; Save.data.name = n.text; Save.data.nameId = n.id; Save.store();
    this.done = 0; Sfx.play('win'); Voice.say('name_done'); ScreenFx.confetti(VW, 70);
  }
};

/* ============ 5. WELT: DER ZAUBERWALD (Ansicht von oben) ============
   Große, frei begehbare Karte (5600 × 3600) mit Zonen:
   Zauberwald (Mitte-West), Hügel (Nordwest), Blumenwiese mit Pilzkreis (Südwest),
   Fluss mit drei Brücken, Fuchslichtung (Nordost), Seerosensee (Südost), Drachenfelsen (Osten).
   Weitere Gebiete später: eigenes Objekt nach diesem Muster anlegen (Karte, NPCS, Wege). */
const WORLD = { w: 5600, h: 3600, cell: 20 };
const riverX = y => 2500 + 170 * Math.sin(y / 420 + 0.4) + 50 * Math.sin(y / 150);
const BRIDGES = [900, 1950, 3050].map(y => ({ y, h: 96, w: 270, x: riverX(y) }));
const LAKE = { x: 3750, y: 2550, rx: 560, ry: 290 };
const POND = { x: 1750, y: 2250, rx: 125, ry: 72 };
const RING = { x: 620, y: 2880, r: 105 };       // Pilzkreis: jeder Pilz singt einen Ton
const WALK_SPEED = 230, RIDE_SPEED = 420;
const ZOOM_RIDE = 0.8, ZOOM_GALLOP = 0.68;   // Kamera zoomt beim Reiten heraus (1 = normal)
// NPCs: Position, Figur, Symbol in der Sprechblase, Begrüßungston. Das Minispiel steht in MINIGAMES (unten).
const NPCS = {
  owl:    { id: 'owl',    x: 1150, y: 1250, art: 'owl',    size: 92,  icon: 'gem',    lift: 30, sound: 'huhu',   hop: 0 },
  fox:    { id: 'fox',    x: 3420, y: 780,  art: 'fox',    size: 100, icon: 'shadow', lift: 0,  sound: 'hop',    hop: 0 },
  frog:   { id: 'frog',   x: 3250, y: 2860, art: 'frog',   size: 72,  icon: 'star',   lift: 10, sound: 'quak',   hop: 0 },
  dragon: { id: 'dragon', x: 4950, y: 1650, art: 'dragon', size: 78,  icon: 'heart',  lift: 20, sound: 'giggle', hop: 0 }
};
const NPC_ORDER = ['owl', 'fox', 'frog', 'dragon'];
const CRYSTAL_COL = { owl: '#b79cff', fox: '#ffb65c', frog: '#6fdc8c', dragon: '#ff8fb1' };
const START_POS = { x: 1500, y: 1850 };
const DRAGON_HOME = { x: NPCS.dragon.x, y: NPCS.dragon.y };
const BX = i => BRIDGES[i].x;
const PATHS = [
  [[1500, 1850], [1380, 1560], [1090, 1290]],                                                                          // Start – Eule
  [[1500, 1850], [1900, 1760], [2150, 1950], [BX(1) - 170, 1950], [BX(1) + 170, 1950], [2950, 1930], [3350, 1880]],    // Start – Brücke – Kreuzung
  [[3350, 1880], [3420, 1400], [3380, 1050], [3360, 810]],                                                              // Kreuzung – Fuchs
  [[3350, 1880], [3120, 2250], [3100, 2600], [3190, 2890]],                                                             // Kreuzung – Frosch
  [[3350, 1880], [3900, 1760], [4400, 1720], [4880, 1690]],                                                             // Kreuzung – Drachenfelsen
  [[1090, 1290], [1250, 900], [1750, 680], [2150, 860], [BX(0) - 170, 900], [BX(0) + 170, 900], [2950, 880], [3360, 810]], // Nordweg
  [[1500, 1850], [1480, 2350], [1250, 2800], [850, 3080], [1250, 3330], [1850, 3200], [2050, 2900], [1480, 2350]],      // Blumenwiese
  [[2050, 2900], [2200, 3050], [BX(2) - 170, 3050], [BX(2) + 170, 3050], [2950, 3080], [3500, 3020], [3900, 2950]]      // Südweg
];
// Versteckte Glitzersterne (werden beim Aufbau auf freie Stellen geschoben)
const GLITTER = [[600, 520], [1900, 430], [2950, 420], [4300, 520], [5250, 700], [5300, 2500], [4800, 3330], [3950, 3330],
  [2650, 3420], [420, 3420], [300, 2200], [650, 1500], [1950, 1200], [3950, 2120], [4250, 1150]];
const uniMark = () => { const n = NAMES.find(n => n.id === Save.data.nameId); return n ? n.icon : null; };
const hopLift = (h, amp = 24) => h > 0 ? Math.sin((1 - clamp(h, 0, 1)) * Math.PI) * amp : 0;
function segDist(px, py, ax, ay, bx, by) { const dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy; const t = l ? clamp(((px - ax) * dx + (py - ay) * dy) / l, 0, 1) : 0; return Math.hypot(px - ax - dx * t, py - ay - dy * t); }
function pathDist(x, y) { let m = 1e9; for (const P of PATHS) for (let i = 0; i < P.length - 1; i++) m = Math.min(m, segDist(x, y, P[i][0], P[i][1], P[i + 1][0], P[i + 1][1])); return m; }
const inEll = (x, y, e, m) => { const px = (x - e.x) / (e.rx + m), py = (y - e.y) / (e.ry + m); return px * px + py * py < 1; };
const onBridge = (x, y) => BRIDGES.some(b => Math.abs(y - b.y) < b.h / 2 - 12 && Math.abs(x - b.x) < b.w / 2 + 30);
const MUSH_COL = ['#ff6b6b', '#ff9f5a', '#c98bff', '#ff7fb0', '#5aa9ff', '#5fd38d', '#ffd23f'];
const RING_NOTES = [523, 587, 659, 698, 784, 880, 988, 1047];

const World = {
  built: false, time: 0,

  /* ---- Karte einmalig aufbauen (fester Zufall: sieht jedes Mal gleich aus) ---- */
  spacing(x, y) {
    if (y > 2620 && x < 2250) return 330;          // Blumenwiese: weit und offen
    if (y < 760 && x < 2250) return 190;            // Hügel im Norden
    if (x > 4400) return 260;                       // Drachenfelsen: mehr Felsen als Bäume
    if (x > riverX(y)) return 125;                  // Osten
    return 100;                                     // Zauberwald: dicht
  },
  terrainOK(x, y, m) {
    if (x < 90 + m || x > WORLD.w - 90 - m || y < 140 + m || y > WORLD.h - 100 - m) return false;
    if (Math.abs(x - riverX(y)) < 64 + m) return false;
    if (inEll(x, y, LAKE, 16 + m) || inEll(x, y, POND, 16 + m)) return false;
    return true;
  },
  build() {
    this.built = true;
    const R = seeded(20261224), W = WORLD;
    this.trees = []; this.bushes = []; this.mushrooms = []; this.flowers = []; this.butterflies = []; this.patches = []; this.rocks = []; this.hills = [];
    // Belegungs-Raster für das Verteilen (damit nichts übereinander steht)
    const occ = new Map(), BK = 160, key = (i, j) => i * 10000 + j;
    const addOcc = (x, y, s) => { const k = key(Math.floor(x / BK), Math.floor(y / BK)); if (!occ.has(k)) occ.set(k, []); occ.get(k).push({ x, y, s }); };
    const occOK = (x, y, s) => { const i0 = Math.floor(x / BK), j0 = Math.floor(y / BK); for (let i = i0 - 2; i <= i0 + 2; i++) for (let j = j0 - 2; j <= j0 + 2; j++) { const a = occ.get(key(i, j)); if (a) for (const o of a) if (dist(x, y, o.x, o.y) < (s + o.s) / 2) return false; } return true; };
    const keep = [[START_POS.x, START_POS.y, 190], [RING.x, RING.y, 210], [DRAGON_HOME.x, DRAGON_HOME.y, 260], [NPCS.fox.x, NPCS.fox.y, 330]];
    for (const k in NPCS) keep.push([NPCS[k].x, NPCS[k].y, 200]);
    for (const b of BRIDGES) { keep.push([b.x - 200, b.y, 170]); keep.push([b.x + 200, b.y, 170]); }
    const free0 = (x, y, m, pm) => this.terrainOK(x, y, m) && pathDist(x, y) > pm && keep.every(k => dist(x, y, k[0], k[1]) > k[2]);
    const tree = (x, y, s, sp) => { this.trees.push({ x, y, s: s || 0.95 + R() * 0.3, kind: R() < 0.22 ? 1 : R() < 0.5 ? 2 : 0, shake: 0 }); addOcc(x, y, sp || 100); };
    // Waldrand rundherum
    for (let x = 20; x < W.w; x += 76) {
      const xa = x + R() * 30, xb = x + R() * 30;
      if (Math.abs(xa - riverX(40)) > 110) tree(xa, 70 + R() * 22, 1.25);
      if (Math.abs(xb - riverX(W.h)) > 110) tree(xb, W.h + 8 + R() * 12, 1.25);
    }
    for (let y = 160; y < W.h - 30; y += 82) { tree(18 + R() * 26, y + R() * 20, 1.2); tree(W.w - 18 - R() * 26, y + R() * 20, 1.2); }
    // Hügel im Norden (nur Bild, begehbar)
    for (let i = 0; i < 9; i++) this.hills.push({ x: 250 + R() * 2000, y: 250 + R() * 450, rx: 180 + R() * 160, ry: 80 + R() * 60 });
    // Felsen: viele am Drachenfelsen, ein paar am Fluss
    for (let i = 0, n = 0; i < 3000 && n < 46; i++) { const x = 4420 + R() * 1050, y = 420 + R() * 2900, r = 26 + R() * 32; if (free0(x, y, r, 70) && occOK(x, y, r * 2 + 60)) { this.rocks.push({ x, y, r, wob: 0, moss: R() < 0.5 }); addOcc(x, y, r * 2 + 60); n++; } }
    for (let i = 0, n = 0; i < 2000 && n < 12; i++) { const y = 300 + R() * 3000, x = riverX(y) + (R() < 0.5 ? -1 : 1) * (110 + R() * 60), r = 22 + R() * 16; if (free0(x, y, r, 70) && occOK(x, y, r * 2 + 50)) { this.rocks.push({ x, y, r, wob: 0, moss: true }); addOcc(x, y, r * 2 + 50); n++; } }
    // Bäume je nach Zone mehr oder weniger dicht
    for (let i = 0; i < 16000; i++) { const x = R() * W.w, y = R() * W.h, sp = this.spacing(x, y); if (free0(x, y, 50, 72) && occOK(x, y, sp)) tree(x, y, 0, sp); }
    // Büsche (manchmal mit Hase), Pilze, Blumen, Schmetterlinge
    const bush = (x, y) => { this.bushes.push({ x, y, shake: 0, peek: 0, dragon: false }); addOcc(x, y, 90); };
    bush(1250, 1950); bush(1700, 1600);
    for (let i = 0, n = 0; i < 4000 && n < 46; i++) { const x = R() * W.w, y = R() * W.h; if (free0(x, y, 40, 60) && occOK(x, y, 110)) { bush(x, y); n++; } }
    const mush = (x, y, o) => this.mushrooms.push(Object.assign({ x, y, col: MUSH_COL[this.mushrooms.length % 4], squish: 0 }, o || {}));
    mush(1330, 1700); mush(1650, 2000); mush(1180, 1460);
    for (let i = 0, n = 0; i < 4000 && n < 60; i++) { const x = R() * W.w, y = R() * W.h; if (free0(x, y, 20, 40) && occOK(x, y, 60)) { mush(x, y); addOcc(x, y, 40); n++; } }
    RING_NOTES.forEach((f, i) => { const a = i / 8 * TAU - Math.PI / 2; mush(RING.x + Math.cos(a) * RING.r, RING.y + Math.sin(a) * RING.r * 0.62, { col: MUSH_COL[i % 7], note: f, ring: i }); });
    const FC = ['#ff9ecb', '#fff', '#ffd27f', '#c9a5ff', '#9ecbff', '#ff8a8a'];
    for (let i = 0; i < 2600; i++) {
      const meadow = i < 900, x = meadow ? 140 + R() * 2100 : 80 + R() * (W.w - 160), y = meadow ? 2650 + R() * 860 : 150 + R() * (W.h - 220);
      if (this.terrainOK(x, y, 6) && pathDist(x, y) > 30) this.flowers.push({ x, y, col: FC[i % FC.length], r: R() * 6 });
    }
    for (let i = 0; i < 220; i++) this.patches.push({ x: R() * W.w, y: R() * W.h, rx: 60 + R() * 130, ry: 30 + R() * 60, light: R() < 0.5 });
    const BC = ['#ff9ecb', '#ffd27f', '#9ecbff', '#c9a5ff', '#fff38a'];
    const bf = (x, y) => this.butterflies.push({ hx: x, hy: y, x, y, ph: this.butterflies.length * 1.7, col: BC[this.butterflies.length % BC.length], away: 0, off: 0, dir: this.butterflies.length * 2.1 });
    [[1450, 1650], [1750, 1950], [1250, 2150]].forEach(p => bf(p[0], p[1]));
    for (let i = 0; i < 12; i++) bf(300 + R() * 1900, 2700 + R() * 750);          // viele auf der Blumenwiese
    for (let i = 0; i < 12; i++) bf(300 + R() * 5000, 300 + R() * 3000);
    // Enten auf dem See
    this.ducks = [0, 1, 2].map(i => ({ a: i * 2.1, sp: 0.12 + i * 0.03, k: 0.45 + i * 0.15, splash: 0 }));
    // Lauf-Raster für die Wegsuche: erst Gelände, dann Hindernisse aufstempeln
    this.cols = Math.ceil(W.w / W.cell); this.rows = Math.ceil(W.h / W.cell);
    this.grid = new Uint8Array(this.cols * this.rows);
    for (let j = 0; j < this.rows; j++) for (let i = 0; i < this.cols; i++) {
      const x = (i + 0.5) * W.cell, y = (j + 0.5) * W.cell;
      const solid = x < 60 || x > W.w - 60 || y < 110 || y > W.h - 64 || (!onBridge(x, y) && Math.abs(x - riverX(y)) < 64) || inEll(x, y, LAKE, 16) || inEll(x, y, POND, 16);
      this.grid[j * this.cols + i] = solid ? 1 : 0;
    }
    for (const t of this.trees) this.stamp(t.x, t.y - 4, 31);
    for (const b of this.bushes) this.stamp(b.x, b.y - 6, 30);
    for (const r of this.rocks) this.stamp(r.x, r.y - r.r * 0.3, r.r * 0.9);
    for (const k in NPCS) this.stamp(NPCS[k].x, NPCS[k].y - 6, k === 'dragon' ? 44 : 36);
    this.stamp(NPCS.fox.x + 86, NPCS.fox.y - 8, 40);     // Fuchsbau
    this.gs = new Float32Array(this.grid.length); this.came = new Int32Array(this.grid.length); this.st = new Uint8Array(this.grid.length);
    // Glitzersterne auf freie Stellen schieben
    this.glitter = GLITTER.map(p => { const k = this.nearFree(p[0], p[1]); return { x: (k % this.cols + 0.5) * W.cell, y: (Math.floor(k / this.cols) + 0.5) * W.cell }; });
    this.renderMinimap();
  },
  stamp(x, y, r) {
    const C = WORLD.cell;

  /* Übersichtskarte einmal vorzeichnen */

  free(x, y) { const i = Math.floor(x / WORLD.cell), j = Math.floor(y / WORLD.cell); return i >= 0 && j >= 0 && i < this.cols && j < this.rows && !this.grid[j * this.cols + i]; },
  nearFree(x, y) {

  /* Wegsuche (A*) – T läuft so automatisch um Bäume herum und über die Brücken */
  findPath(sx, sy, tx, ty) {

      const ci = cur % cols, cj = Math.floor(cur / cols);

        if (!di && !dj) continue;
        const ni = ci + di, nj = cj + dj; if (ni < 0 || nj < 0 || ni >= cols || nj >= rows) continue;

  /* ---- Der Drache als Dauergast: kleine Streiche, während T frei herumläuft ---- */

  /* ---- Ablauf ---- */
  update(dt) {

      if (kx || ky) {

        const n = Math.hypot(kx, ky), nx = T.x + kx / n * spd, ny = T.y + ky / n * spd;
        if (this.free(nx, T.y)) T.x = nx; if (this.free(T.x, ny)) T.y = ny;

      }
    }
    if (T.path && T.path.length) {

    if (D.vis && !D.fly && inView(D.x, D.y, 160)) add(D.y, () => {

      add(T.y + 0.1, () => drawActor(c, 't', T.x, T.y, { size: 84, t, walk: T.walk, flip: T.face < 0, lift: hopLift(T.hop) + ph(4) }));

        c.save(); c.translate(ax + Math.cos(a) * b, ay + Math.sin(a) * b); circ(c, 0, 0, 30); fs(c, '#ffd54a', '#fff', 4); c.rotate(a); drawIcon(c, 'right', 0, 0, 34); c.restore();

    for (const id of NPC_ORDER) { const s = this.slotScreen(id); const pl = this.packLv(id); if (pl > 0) { if (pl >= 3) { c.fillStyle = 'rgba(255,213,74,' + (0.5 + Math.sin(t * 4) * 0.2) + ')'; circ(c, s.x, s.y, 24); c.fill(); } drawCrystal(c, s.x, s.y, 10 + pl * 4, CRYSTAL_COL[id]); } else { c.setLineDash([5, 5]); circ(c, s.x, s.y, 15); c.strokeStyle = 'rgba(150,130,180,0.6)'; c.lineWidth = 2.5; c.stroke(); c.setLineDash([]); } }
    c.save(); c.translate(H.pack.x, H.pack.y); c.rotate(this.packWig > 0 ? Math.sin(this.packWig * 22) * 0.2 * this.packWig : 0);

    if (Save.data.celebrated) { c.fillStyle = '#ffd54a'; sparklePath(c, H.pack.r * 0.6, -H.pack.r * 0.6, 9 + Math.sin(t * 5) * 3); c.fill(); }
    c.restore();
    const sy = H.pack.y + H.pack.r + 26, sx = H.pack.x + H.pack.r - 92, sp = 1 + Math.sin(clamp(this.starPop, 0, 1) * Math.PI) * 0.3;
    rr(c, sx, sy - 20, 92, 40, 20); fs(c, 'rgba(255,255,255,0.75)');
    c.save(); c.translate(sx + 22, sy); c.scale(sp, sp); starPath(c, 0, 0, 15); fs(c, '#ffe066', '#f0b429', 2.5); c.restore();
    c.fillStyle = '#7a5cc9'; c.font = '800 22px system-ui, sans-serif'; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(String(this.starsFound()), sx + 62, sy + 1); c.textAlign = 'left'; c.textBaseline = 'alphabetic';
    drawRoundBtn(c, H.hint.x, H.hint.y, H.hint.r, { color: '#fff7ea', glow: !!this.hint });
    c.save(); circ(c, H.hint.x, H.hint.y, H.hint.r - 3); c.clip(); drawActor(c, 'unicorn', H.hint.x - 10, H.hint.y + H.hint.r * 0.78, { size: H.hint.r * 1.35, t: 1, noShadow: true, mark: uniMark() }); c.restore();
    drawRoundBtn(c, H.map.x, H.map.y, H.map.r, { color: '#fff7ea', icon: 'map', iconScale: 1.1 });
    if (this.mapOpen) this.drawMap(c, t);
  },
  mapRect() { const m = Math.min((VW - 170) / WORLD.w, (VH - 50) / WORLD.h), w = WORLD.w * m, h = WORLD.h * m; return { x: (VW - w) / 2 - 30, y: (VH - h) / 2, w, h, m }; },
  mapClose() { const r = Math.max(View.btn / 2 - 4, 46); return { x: VW - 16 - r, y: 16 + r, r }; },
  drawMap(c, t) {
    const M = this.mapRect();
    c.fillStyle = 'rgba(40,40,70,0.55)'; c.fillRect(0, 0, VW, VH);
    rr(c, M.x - 12, M.y - 12, M.w + 24, M.h + 24, 22); fs(c, '#fff3d6', '#d9b98a', 5);
    c.save(); rr(c, M.x, M.y, M.w, M.h, 14); c.clip(); c.drawImage(this.minimap, M.x, M.y, M.w, M.h); c.restore();
    const P = (x, y) => [M.x + x * M.m, M.y + y * M.m];
    ['owl', 'fox', 'frog'].forEach((id, i) => { const [x, y] = P(NPCS[id].x, NPCS[id].y); c.save(); c.translate(x, y - 18); c.scale(0.62, 0.62); this.drawBubble(c, 0, 0, NPCS[id].icon, Save.data.level[id], false, i, t); c.restore(); });
    const D = this.dragon;
    if (D.vis) { const [x, y] = P(D.x, D.y); drawActor(c, 'dragon', x, y + 6, { size: 34, t, noShadow: true, flip: true }); }
    if (this.crystalGround) { const [x, y] = P(this.crystalGround.x, this.crystalGround.y); drawCrystal(c, x, y - 6, 9 + Math.sin(t * 6) * 2, CRYSTAL_COL[this.crystalGround.who]); }
    const [tx, ty] = P(this.T.x, this.T.y), pul = 1 + Math.sin(t * 5) * 0.12;
    c.fillStyle = 'rgba(255,143,177,0.45)'; circ(c, tx, ty - 14, 24 * pul); c.fill();
    drawActor(c, 't', tx, ty + 6, { size: 40, t, noShadow: true });
    const X = this.mapClose(); drawRoundBtn(c, X.x, X.y, X.r, { color: '#9ecbff', icon: 'x', iconScale: 0.8 });
  },

  /* ---- Eingabe ---- */
  down(p) {
    const H = this.hud();
    if (this.mapOpen) {
      const X = this.mapClose(), M = this.mapRect();
      if (hit(p, X.x, X.y, X.r + 8)) { this.mapOpen = false; Sfx.play('tap'); return; }
      if (p.x > M.x && p.x < M.x + M.w && p.y > M.y && p.y < M.y + M.h) {
        const wx = (p.x - M.x) / M.m, wy = (p.y - M.y) / M.m; this.mapOpen = false; Sfx.play('pop');
        if (!this.ride) this.mount();
        this.walkTo(wx, wy); this.idle = 0;
      }
      return;
    }
    if (hit(p, H.pack.x, H.pack.y, H.pack.r + 6)) { this.packWig = 1; Sfx.play('tap'); Voice.say('backpack_' + NPC_ORDER.filter(id => this.inPack(id)).length); return; }
    if (this.blocked()) return;
    this.idle = 0;
    if (hit(p, H.hint.x, H.hint.y, H.hint.r + 6)) { this.showHint(); return; }
    if (hit(p, H.map.x, H.map.y, H.map.r + 6)) { this.mapOpen = true; this.T.path = null; Sfx.play('pop'); Voice.say('map_open'); return; }
    const w0 = this.toWorld(p), x = w0.x, y = w0.y, T = this.T, U = this.U, t = this.time, D = this.dragon;
    this.dragTap = false;
    const g = this.crystalGround; if (g && dist(x, y, g.x, g.y - 16) < 62) { Sfx.play('tap'); this.walkTo(g.x, g.y); return; }
    for (const id of ['owl', 'fox', 'frog']) { const n = NPCS[id]; if (dist(x, y, n.x, n.y - 45 - n.lift) < 78 || dist(x, y, n.x, n.y - n.size - n.lift - 44) < 48) { n.hop = 1; Sfx.play('tap'); const s = this.npcSpot(n); this.walkTo(s.x, s.y, () => this.startNpc(id)); return; } }
    if (D.vis && !D.fly) {
      const lift = D.mode === 'home' ? 20 : 0;
      if (dist(x, y, D.x, D.y - 50 - lift) < 66 || (Save.data.dragonFriend && dist(x, y, D.x, D.y - 78 - lift - 44) < 48)) {
        D.hop = 1; Sfx.play('giggle'); this.fx.burst(D.x - 30, D.y - 80, 6, { shape: 'heart', color: '#ff8fb1', g: -60, sp1: 80 });
        if (this.dragonReady()) { if (this.prank && this.prank.kind === 'visit') this.prank.stay = true; const s = this.dragonSpot(); this.walkTo(s.x, s.y, () => this.startNpc('dragon')); }
        else Voice.say('dragon_tap', { pitch: 1.7 });
        return;
      }
    }
    for (const b of this.bushes) if (b.dragon && dist(x, y, b.x, b.y - 18) < 70) { this.prank.found = true; Sfx.play('giggle'); return; }
    if (this.ride && dist(x, y, T.x, T.y - 55) < 66) { this.dismount(); return; }
    if (!this.ride && dist(x, y, U.x, U.y - 45) < 56) { if (dist(T.x, T.y, U.x, U.y) < 240) { this.mount(); } else { U.hop = 1; Sfx.play('hop'); Voice.say('uni_tap'); } return; }
    if (!this.ride && dist(x, y, T.x, T.y - 45) < 44) { T.hop = 1; Sfx.play('hop'); return; }
    for (const s of this.glitter) if (dist(x, y, s.x, s.y - 20) < 50) { Sfx.play('star'); this.walkTo(s.x, s.y); return; }
    for (const b of this.butterflies) if (b.away <= 0 && dist(x, y, b.x, b.y) < 52) { b.away = 7; b.dir = rnd(TAU); Sfx.play('flutter'); this.fx.burst(b.x, b.y, 6, { g: 40, sp1: 90, s1: 8 }); return; }
    for (const d of this.ducks) if (d.x != null && dist(x, y, d.x, d.y - 10) < 46) { d.splash = 1; Sfx.play('quak'); this.fx.burst(d.x, d.y, 10, { shape: 'dot', color: '#e6f7ff', g: 300, up: 80, sp1: 110, s1: 8 }); return; }
    for (const m of this.mushrooms) if (dist(x, y, m.x, m.y - 12) < 44) {
      m.squish = 1;
      if (m.note) { Sfx.play('note', m.note); this.fx.add({ x: m.x, y: m.y - 40, vy: -60, g: 0, life: 1, size: 14, color: m.col, shape: 'heart' }); }
      else { Sfx.play('squeak'); this.fx.burst(m.x, m.y - 26, 7, { shape: 'dot', color: '#fff', g: -30, sp1: 70, s1: 7 }); }
      return;
    }
    for (const r of this.rocks) if (dist(x, y, r.x, r.y - r.r * 0.45) < r.r + 8) { r.wob = 1; Sfx.play('land'); this.fx.burst(r.x, r.y - r.r, 5, { shape: 'dot', color: '#d8d8e4', g: 200, sp1: 80, s1: 6 }); return; }
    for (const b of this.bushes) if (dist(x, y, b.x, b.y - 18) < 48) { b.shake = 1; b.peek = 1; Sfx.play('rustle'); this.fx.burst(b.x, b.y - 24, 8, { shape: 'dot', color: '#74c985', g: 260, sp1: 120, s1: 8 }); return; }
    for (const tr of this.trees) if (dist(x, y, tr.x, tr.y - 80 * tr.s) < 42 * tr.s) { tr.shake = 1; Sfx.play('rustle'); this.fx.burst(tr.x, tr.y - 80 * tr.s, 9, { shape: 'dot', color: tr.kind === 1 ? '#f7a8c8' : '#84d48f', g: 220, sp1: 100, s1: 9 }); break; }
    if (Math.abs(x - riverX(y)) < 46 && !onBridge(x, y) || inEll(x, y, LAKE, 0) || inEll(x, y, POND, 0)) { Sfx.play('plop'); this.fx.burst(x, y, 8, { shape: 'dot', color: '#e6f7ff', g: 300, up: 80, sp1: 110, s1: 8 }); }
    this.dragTap = true; this.lastPathT = t; this.walkTo(x, y);
  },
  move(p) {
    // Finger gedrückt halten und ziehen: T läuft dem Finger nach
    if (this.mapOpen || !this.dragTap || this.blocked() || this.time - this.lastPathT < 0.22 || dist(p.x, p.y, p.sx, p.sy) < 30) return;
    this.lastPathT = this.time; this.idle = 0; const w0 = this.toWorld(p); this.walkTo(w0.x, w0.y);
  },
  up() { this.dragTap = false; },
  key(k) {
    if (k === 'KeyM') { this.mapOpen = !this.mapOpen; return; }
    if (this.blocked() || this.mapOpen) return;
    if (k === 'KeyR') { this.ride ? this.dismount() : this.mount(); return; }
    if (k !== 'Space' && k !== 'Enter') return;
    let best = null, bd = 150; for (const id of ['owl', 'fox', 'frog']) { const d = dist(this.T.x, this.T.y, NPCS[id].x, NPCS[id].y); if (d < bd) { bd = d; best = id; } }
    if (best) { const s = this.npcSpot(NPCS[best]); this.walkTo(s.x, s.y, () => this.startNpc(best)); }
    else if (this.dragonReady() && dist(this.T.x, this.T.y, this.dragon.x, this.dragon.y) < 170) this.startNpc('dragon');
  }
};

/* ============ 6. MINISPIELE ============
   Neues Minispiel: Objekt mit enter/update/draw/down anlegen, am Ende finishMini('id') aufrufen
   und in MINIGAMES eintragen. */
function miniExit() { const r = Math.max(View.btn / 2 - 6, 44); return { x: 14 + r, y: 14 + r, r }; }
function drawMiniExit(c) { const e = miniExit(); drawRoundBtn(c, e.x, e.y, e.r, { color: '#ffb199', icon: 'home', iconScale: 0.9 }); }
// Jedes Minispiel hat drei Stufen. Wer eine Stufe schafft, lässt seinen Kristall wachsen (Stufe 3 = golden).
const miniLevel = id => Math.min(Save.data.level[id] || 0, 2);
function finishMini(id) { if (Game.pending) return; const up = (Save.data.level[id] || 0) < 3; if (up) Save.data.level[id] = (Save.data.level[id] || 0) + 1; Save.data.crystals[id] = true; Save.store(); Game.go(World, { from: id, reward: up ? id : null }); }
function miniWin(scene) { scene.winT = 0; Sfx.play('win'); Voice.say('win'); ScreenFx.confetti(VW, 80); }
function drawSparkleLine(c, x1, y1, x2, y2, t) { const n = Math.max(3, Math.floor(dist(x1, y1, x2, y2) / 46)); for (let i = 1; i < n; i++) { const k = i / n, tw = Math.max(0, Math.sin(t * 6 - i * 0.7)); c.fillStyle = 'rgba(255,225,90,' + (0.5 + tw * 0.5) + ')'; sparklePath(c, lerp(x1, x2, k), lerp(y1, y2, k) - Math.sin(k * Math.PI) * 30, 8 + tw * 7); c.fill(); } }
// Fortschritt oben rechts: ein Stern pro Runde
function drawRoundStars(c, n, done) { for (let i = 0; i < n; i++) { starPath(c, VW - 40 - (n - 1 - i) * 36, 40, 14); fs(c, i < done ? '#ffd54a' : 'rgba(255,255,255,0.7)', '#f0b429', 2); } }

/* ---------- Eule: Muster fortsetzen ----------
   u = Muster-Baustein, n = Länge der Reihe, gaps = Stellen der Lücken (fehlt = letzte Stelle), k = Anzahl Auswahl-Steine */
const OWL_ROUNDS = [
  [{ u: 'AB', n: 5 }, { u: 'AAB', n: 6 }, { u: 'ABC', n: 6 }, { u: 'ABB', n: 6 }, { u: 'AB', n: 6, gaps: [2] }],
  [{ u: 'AABB', n: 7 }, { u: 'ABC', n: 7, gaps: [3] }, { u: 'ABAC', n: 8, k: 4 }, { u: 'AAB', n: 8, gaps: [4] }, { u: 'AB', n: 7, gaps: [2, 6] }],
  [{ u: 'ABCB', n: 9, gaps: [5], k: 4 }, { u: 'AABC', n: 9, gaps: [2], k: 4 }, { u: 'ABC', n: 9, gaps: [1, 8], k: 4 }, { u: 'ABBCC', n: 10, k: 4 }, { u: 'ABCD', n: 10, gaps: [3, 9], k: 4 }]
];
const OwlGame = {
  id: 'owl',
  enter() { this.lv = miniLevel('owl'); this.rounds = OWL_ROUNDS[this.lv]; this.round = 0; this.winT = -1; this.t = 0; this.wrongs = 0; this.setup(); Voice.say(this.lv ? 'owl_intro2' : 'owl_intro'); },
  setup() {
    const d = this.rounds[this.round], T = shuffle([0, 1, 2, 3]);
    this.seq = Array.from({ length: d.n }, (_, i) => T['ABCD'.indexOf(d.u[i % d.u.length])]);
    this.gaps = (d.gaps || [d.n - 1]).slice().sort((a, b) => a - b); this.gi = 0; this.filled = [];
    this.opts = shuffle(T.slice(0, d.k || 3));
    this.state = 'intro'; this.st = 0; this.shown = 0; this.fly = null; this.idle = 0; this.hintT = 0; this.bump = -1; this.bumpT = 0; this.shake = 0;
    if (this.round > 0) Voice.say(this.gaps.length > 1 ? 'owl_two' : 'owl_next');
    else if (this.gaps.length > 1) Voice.say('owl_two', { queue: true });
  },
  get gap() { return this.gaps[this.gi]; },
  get ans() { return this.seq[this.gap]; },

/* ---------- Fuchs: Schatten zuordnen ----------
   Pro Stufe zwei Durchgänge. n = Tiere, mirror = Schatten gespiegelt, decoy = Extra-Schatten ohne Tier */
const FOX_FIGS = ['unicorn', 'dragon', 'owl', 'frog', 'butterfly', 'fox', 't'];
const FOX_ROUNDS = [[{ n: 3 }, { n: 4 }], [{ n: 4 }, { n: 5, mirror: true }], [{ n: 5, mirror: true }, { n: 5, mirror: true, decoy: 1 }]];
const FoxGame = {
  id: 'fox',
  enter() {
    this.lv = miniLevel('fox'); this.rounds = FOX_ROUNDS[this.lv]; this.round = 0; this.t = 0; this.winT = -1;
    this.setup(); Voice.say(['fox_intro', 'fox_intro2', 'fox_intro3'][this.lv]);
  },
  setup() {
    const d = this.rounds[this.round]; this.n = d.n; this.mirror = !!d.mirror; this.m = d.n + (d.decoy || 0);
    this.idle = 0; this.hintT = 0; this.sel = -1; this.wrongs = 0; this.nextT = -1;
    const figs = shuffle(FOX_FIGS.slice()), names = figs.slice(0, this.n);
    this.decoy = d.decoy ? figs[this.n] : null;
    const ids = names.map((_, i) => i).concat(d.decoy ? [-1] : []);
    let order; do { order = shuffle(ids.slice()); } while (order.every((v, i) => v === i));
    this.slots = order;                           // slots[j] = Index der Figur, die in Schatten j gehört (-1 = Täusch-Schatten)
    const L = this.layout();
    this.items = names.map((name, i) => ({ name, x: L.home[i].x, y: L.home[i].y + 200, placed: false, drag: null, shake: 0, hop: 0 }));
    if (this.round > 0) Voice.say(d.decoy ? 'fox_decoy' : 'fox_next');
  },
  layout() {
    const line = (n, room) => { const sp = Math.min(235, (VW - room) / Math.max(1, n - 1)); return { sp, xs: Array.from({ length: n }, (_, i) => VW / 2 + (i - (n - 1) / 2) * sp) }; };
    const top = line(this.m, this.m > 3 ? 300 : 250), bot = line(this.n, this.n > 3 ? 420 : 250);
    const card = Math.min(152, top.sp - 14), k = Math.min(card / 152, bot.sp / 170);
    return { card, k, slot: top.xs.map(x => ({ x, y: 168 })), home: bot.xs.map(x => ({ x, y: 400 })), uni: { x: 62, y: VH - 12 }, fox: { x: VW - 64, y: VH - 12 } };
  },
  resize() { const L = this.layout(); this.items.forEach((it, i) => { if (it.drag) return; const tg = it.placed ? L.slot[this.slots.indexOf(i)] : L.home[i]; it.x = tg.x; it.y = tg.y; }); },
  update(dt) {
    this.t += dt; if (this.hintT > 0) this.hintT -= dt;
    const L = this.layout();
    this.items.forEach((it, i) => {
      if (it.shake > 0) it.shake -= dt * 2.5; if (it.hop > 0) it.hop -= dt * 2.5;
      if (it.drag != null) return;
      const tg = it.placed ? L.slot[this.slots.indexOf(i)] : L.home[i], k = Math.min(1, dt * 12);
      it.x = lerp(it.x, tg.x, k); it.y = lerp(it.y, tg.y, k);
    });
    if (this.winT >= 0) { this.winT += dt; if (this.winT > 2.8) finishMini('fox'); return; }
    if (this.nextT >= 0) { this.nextT += dt; if (this.nextT > 1.6) { this.round++; this.setup(); } return; }
    this.idle += dt; if (this.idle > CONFIG.hintDelay) this.hint();
  },
  hint() { this.idle = 0; this.hintT = 5; Sfx.play('hint'); Voice.say('fox_hint'); },
  tryPlace(i, j) {
    const it = this.items[i], L = this.layout(); this.sel = -1;
    if (this.slots[j] === i) {
      it.placed = true; it.hop = 1; Sfx.play('good'); ScreenFx.burst(L.slot[j].x, L.slot[j].y, 18, { g: 160 }); this.wrongs = 0;
      if (this.items.every(q => q.placed)) { if (this.round + 1 >= this.rounds.length) miniWin(this); else { this.nextT = 0; Sfx.play('win'); Voice.say('good'); } }
      else Voice.say('good');
    } else { it.shake = 1; this.wrongs++; Sfx.play('wrong'); Voice.say('try_again'); if (this.wrongs >= 2) { this.wrongs = 0; this.hintT = 5; } }
  },
  draw(c) {
    const L = this.layout(), t = this.t;
    const g = c.createLinearGradient(0, 0, 0, VH); g.addColorStop(0, '#fff0c9'); g.addColorStop(0.55, '#e3f6c8'); g.addColorStop(1, '#bfe8b4'); c.fillStyle = g; c.fillRect(0, 0, VW, VH);
    c.fillStyle = 'rgba(255,255,255,0.35)'; for (let i = 0; i < 5; i++) { c.beginPath(); c.moveTo(VW * 0.5 + (i - 2) * 60, -20); c.lineTo(VW * 0.5 + (i - 2) * 300 - 60, VH); c.lineTo(VW * 0.5 + (i - 2) * 300 + 60, VH); c.closePath(); c.fill(); }
    c.fillStyle = '#a6dd9e'; ell(c, VW / 2, VH + 70, VW * 0.75, 170); c.fill();
    const hintI = this.hintT > 0 ? this.items.findIndex(q => !q.placed) : -1;
    L.slot.forEach((s, j) => {
      const h = L.card / 2, want = this.slots[j], isHint = hintI >= 0 && hintI === want;
      rr(c, s.x - h, s.y - h, L.card, L.card, 26); fs(c, '#fffdf5', isHint ? '#ffd54a' : '#e6d9bd', isHint ? 6 : 3);
      const name = want < 0 ? this.decoy : this.items[want].placed ? null : this.items[want].name;
      if (name) { c.save(); c.translate(s.x, 0); if (this.mirror) c.scale(-1, 1); drawSilhouette(c, name, 0, s.y + 56 * L.card / 152, 112 * L.card / 152); c.restore(); }
    });
    const order = this.items.map((_, i) => i).sort((a, b) => (this.items[a].drag != null) - (this.items[b].drag != null));
    for (const i of order) {
      const it = this.items[i], sx = it.shake > 0 ? Math.sin(it.shake * 30) * 9 * it.shake : 0, wig = hintI === i ? Math.sin(t * 10) * 4 : 0;
      const k = it.placed ? L.card / 152 : L.k;
      if (this.sel === i && it.drag == null) { c.fillStyle = 'rgba(255,225,90,0.5)'; circ(c, it.x, it.y, 74 * k); c.fill(); }
      drawActor(c, it.name, it.x + sx + wig, it.y + 56 * k, { size: (it.drag != null ? 124 : 112) * k, t: it.placed || it.drag != null ? t : 0.5, lift: hopLift(it.hop, 26) + (it.drag != null ? 8 : 0), mark: it.name === 'unicorn' ? uniMark() : null });
    }

    const win = this.winT >= 0 || this.nextT >= 0;
    drawRoundStars(c, this.rounds.length, this.winT >= 0 ? this.rounds.length : this.round + (this.nextT >= 0 ? 1 : 0));
    drawActor(c, 'unicorn', L.uni.x, L.uni.y, { size: 96, t, lift: win ? Math.abs(Math.sin(t * 8)) * 26 : 0, mark: uniMark(), glow: this.hintT > 0 });
    drawActor(c, 'fox', L.fox.x, L.fox.y, { size: 104, t, lift: win ? Math.abs(Math.sin(t * 8 + 1)) * 20 : 0 });
    drawMiniExit(c);
  },
  down(p) {
    const e = miniExit(); if (hit(p, e.x, e.y, e.r + 6)) { Sfx.play('tap'); Game.go(World, { from: 'fox' }); return; }
    if (this.winT >= 0 || this.nextT >= 0) return;
    const L = this.layout(); this.idle = 0;
    for (let i = 0; i < this.n; i++) { const it = this.items[i]; if (!it.placed && it.drag == null && hit(p, it.x, it.y, 78 * L.k)) { it.drag = p.id; it.ox = it.x - p.x; it.oy = it.y - p.y; this.hintT = 0; Sfx.play('pop'); return; } }
    if (this.sel >= 0) for (let j = 0; j < this.m; j++) if (hit(p, L.slot[j].x, L.slot[j].y, L.card * 0.6) && (this.slots[j] < 0 || !this.items[this.slots[j]].placed)) { this.tryPlace(this.sel, j); return; }
    if (hit(p, L.uni.x, L.uni.y - 50, 56)) this.hint();
  },
  move(p) { for (const it of this.items) if (it.drag === p.id) { it.x = p.x + it.ox; it.y = p.y + it.oy; this.idle = 0; } },
  up(p) {
    const L = this.layout();
    this.items.forEach((it, i) => {
      if (it.drag !== p.id) return; it.drag = null; this.idle = 0;
      let best = -1, bd = Math.max(80, L.card * 0.7); for (let j = 0; j < this.m; j++) { if (this.slots[j] >= 0 && this.items[this.slots[j]].placed) continue; const d = dist(it.x, it.y, L.slot[j].x, L.slot[j].y); if (d < bd) { bd = d; best = j; } }
      if (best >= 0) this.tryPlace(i, best);
      else if (dist(p.x, p.y, p.sx, p.sy) < 14) { this.sel = i; it.hop = 1; }   // nur angetippt: auswählen, dann Schatten antippen

/* ---------- Frosch: Hüpfspiel (Seitenansicht) ----------
   Die Strecke wird jedes Mal neu gebaut. n = Plattformen, gap/w = Lücken und Breiten (von–bis), dy = Höhenunterschied,
   move = jede wievielte Seerose schwimmt, spring = jede wievielte Plattform hat einen Sprungpilz, stars = Anzahl Sterne */
const FROG_LEVELS = [
  { n: 18, gap: [80, 110], w: [125, 160], dy: 40, move: 0, amp: 0, spring: 0, stars: 10 },
  { n: 24, gap: [90, 122], w: [110, 145], dy: 50, move: 4, amp: 22, spring: 7, stars: 14 },
  { n: 30, gap: [100, 130], w: [100, 135], dy: 55, move: 3, amp: 26, spring: 6, stars: 18 }
];
const FrogGame = {
  id: 'frog', WATER: 440,
  build(d) {
    const R = seeded(1000 * this.lv + Math.floor(Math.random() * 100000));
    this.pl = [{ x: -300, w: 580, y: 400, type: 'ground' }]; this.stars = [];
    let x = 280, y = 400, wide = false;
    for (let i = 0; i < d.n; i++) {
      const gp = wide ? 90 : lerp(d.gap[0], d.gap[1], R()), w = wide ? 270 : lerp(d.w[0], d.w[1], R());
      const ny = wide ? y : clamp(Math.round(y + (R() * 2 - 1) * d.dy), 300, 400);
      x += gp; y = ny;
      const pl = { x, w, y, type: i % 2 ? 'stone' : 'pad' };
      wide = false;
      if (d.spring && i % d.spring === d.spring - 1 && i < d.n - 2) { pl.type = 'stone'; pl.spring = true; wide = true; }
      else if (d.move && i % d.move === d.move - 1) { pl.type = 'pad'; pl.bx = x; pl.amp = d.amp; pl.ph = i; }   // schwimmt hin und her
      this.pl.push(pl); x += w;
    }
    x += 90; this.endX = x; this.pl.push({ x, w: 900, y: 400, type: 'ground' }); this.levelW = x + 560;
    // Sterne gleichmäßig verteilen, über Sprungpilzen ganz hoch
    const cand = this.pl.slice(1, -1);
    for (let k = 0; k < d.stars; k++) {
      const pl = cand[Math.min(cand.length - 1, Math.round((k + 0.5) * cand.length / d.stars))];
      this.stars.push({ x: pl.x + pl.w / 2 + (pl.spring ? 0 : 0), y: pl.y - (pl.spring ? 270 : k % 2 ? 128 : 64), got: false, pl });
    }
  },
  enter() {
    this.lv = miniLevel('frog'); const d = FROG_LEVELS[this.lv];
    this.build(d);
    this.p = { x: 110, y: 400, vy: 0, ground: true, face: 1, coy: 0, buf: 0, moving: false };
    this.safe = { pl: this.pl[0], rel: 410, y: 400 }; this.cam = 0; this.t = 0; this.winT = -1; this.got = 0; this.idle = 0; this.bestX = 110; this.hintT = 0; this.respawn = 0; this.falls = 0; this.jumpHeld = false; this.teach = this.lv ? 0 : 7;
    this.fx = new Fx(); this.uni = { x: 30, y: 250 };
    Voice.say(this.lv ? 'frog_intro2' : 'frog_intro');
  },
  btns() { const r = Math.max(View.btn / 2, 54), rj = r * 1.3; return { l: { x: 22 + r, y: VH - 22 - r, r }, r: { x: 22 + r * 3 + 18, y: VH - 22 - r, r }, j: { x: VW - 26 - rj, y: VH - 26 - rj, r: rj } }; },
  update(dt) {
    this.t += dt; this.fx.update(dt); if (this.hintT > 0) this.hintT -= dt; if (this.teach > 0) this.teach -= dt;
    const p = this.p, B = this.btns(), K = Input.keys;
    this.uni.x = lerp(this.uni.x, p.x - 86 * p.face, Math.min(1, dt * 3)); this.uni.y = lerp(this.uni.y, p.y - 170 + Math.sin(this.t * 2) * 8, Math.min(1, dt * 3));
    for (const s of this.stars) { if (s.got && s.pop > 0) s.pop -= dt * 3; if (s.pl.amp) s.x = s.pl.x + s.pl.w / 2; }
    for (const pl of this.pl) { if (pl.bob > 0) pl.bob -= dt * 2; if (pl.boing > 0) pl.boing -= dt * 2.5; }
    if (this.winT >= 0) { this.winT += dt; p.moving = false; if (this.winT > 2.8) finishMini('frog'); return; }
    if (this.respawn > 0) { this.respawn -= dt; if (this.respawn <= 0) { p.x = this.safe.pl.x + this.safe.rel; p.y = this.safe.y; p.vy = 0; p.ground = true; p.on = this.safe.pl; Sfx.play('pop'); this.fx.burst(p.x - this.cam, p.y - 40, 10, { g: 60 }); } return; }
    let left = K.has('ArrowLeft'), right = K.has('ArrowRight'), jump = K.has('Space') || K.has('ArrowUp');
    for (const q of Input.pointers.values()) { if (hit(q, B.l.x, B.l.y, B.l.r + 14)) left = true; else if (hit(q, B.r.x, B.r.y, B.r.r + 14)) right = true; else if (hit(q, B.j.x, B.j.y, B.j.r + 22)) jump = true; }
    this.pressed = { left, right, jump };
    if (jump && !this.jumpHeld) p.buf = 0.16; this.jumpHeld = jump;
    const dir = (right ? 1 : 0) - (left ? 1 : 0);
    if (dir) { p.face = dir; p.x = clamp(p.x + dir * 235 * dt, 30, this.levelW - 60); }
    p.moving = !!dir;
    for (const pl of this.pl) if (pl.amp) { const nx = pl.bx + Math.sin(this.t * 1.5 + pl.ph) * pl.amp; if (p.on === pl && p.ground) p.x += nx - pl.x; pl.x = nx; }
    p.buf -= dt; p.coy -= dt;
    if (p.buf > 0 && (p.ground || p.coy > 0)) { p.vy = -650; p.ground = false; p.coy = 0; p.buf = 0; Sfx.play('jump'); }
    const prevY = p.y, wasGround = p.ground, fallV = p.vy; p.vy = Math.min(p.vy + 1500 * dt, 900); p.y += p.vy * dt; p.ground = false;
    if (p.vy >= 0) for (const pl of this.pl) if (p.x > pl.x - 10 && p.x < pl.x + pl.w + 10 && prevY <= pl.y + 0.5 && p.y >= pl.y) {
      p.y = pl.y; p.vy = 0; p.ground = true; p.coy = 0.12; this.safe = { pl, rel: clamp(p.x - pl.x, 30, pl.w - 30), y: pl.y }; p.on = pl;
      if (pl.spring && !wasGround && fallV > 150 && Math.abs(p.x - (pl.x + pl.w / 2)) < 38) { p.vy = -980; p.ground = false; pl.boing = 1; Sfx.play('jump'); Sfx.play('squeak'); this.fx.burst(p.x - this.cam, pl.y - 30, 8, { g: 200 }); break; }
      if (!wasGround && fallV > 250) { Sfx.play('land'); if (pl.type === 'pad') pl.bob = 1; } break;
    }
    if (p.y > this.WATER + 26) { this.respawn = 0.7; this.falls++; Sfx.play('splash'); this.fx.burst(p.x - this.cam, this.WATER, 16, { shape: 'dot', color: '#e6f7ff', g: 500, up: 220, sp1: 160, s1: 10 }); if (this.falls === 1 || this.falls % 4 === 0) Voice.say('frog_splash'); }
    for (const s of this.stars) if (!s.got && dist(p.x, p.y - 45, s.x, s.y) < 52) { s.got = true; s.pop = 1; this.got++; Sfx.play('star'); this.fx.burst(s.x - this.cam, s.y, 10, { g: 120 }); }
    if (p.x > this.endX + 170 && p.ground) { miniWin(this); return; }
    this.cam = lerp(this.cam, clamp(p.x - VW * 0.36, 0, this.levelW - VW), Math.min(1, dt * 6));
    if (p.x > this.bestX + 25) { this.bestX = p.x; this.idle = 0; this.hintT = 0; } else { this.idle += dt; if (this.idle > CONFIG.hintDelay) { this.idle = 0; this.hintT = 5; Sfx.play('hint'); Voice.say('frog_hint'); } }
  },
  draw(c) {
    const t = this.t, cam = this.cam, p = this.p, W = this.WATER;
    const g = c.createLinearGradient(0, 0, 0, VH); g.addColorStop(0, '#9fdcff'); g.addColorStop(0.7, '#e3f6ff'); c.fillStyle = g; c.fillRect(0, 0, VW, VH);
    c.fillStyle = '#fff3a0'; circ(c, VW - 150, 90, 40); c.fill();
    for (let i = 0; i < 6; i++) drawCloud(c, ((i * 420 - cam * 0.15) % (VW + 400) + VW + 400) % (VW + 400) - 200, 70 + (i % 3) * 46, 0.7 + (i % 2) * 0.3);
    c.fillStyle = '#c6ecc0'; for (let i = -1; i < 8; i++) { ell(c, i * 520 - cam * 0.3 % 520, W + 10, 330, 150 + (i & 1) * 40); c.fill(); }
    c.fillStyle = '#a6dd9e'; for (let i = -1; i < 10; i++) { ell(c, i * 380 - cam * 0.55 % 380 + 100, W + 20, 240, 90 + (i & 1) * 30); c.fill(); }
    c.fillStyle = '#8fd0f0'; c.fillRect(0, W, VW, VH - W);
    c.strokeStyle = 'rgba(255,255,255,0.7)'; c.lineWidth = 3; c.lineCap = 'round';
    for (let r = 0; r < 3; r++) for (let x = -(cam * (1 + r * 0.1) + t * 20 * (r + 1)) % 90 - 90; x < VW + 90; x += 90) { c.beginPath(); c.arc(x + r * 30, W + 18 + r * 30, 14, Math.PI * 1.15, Math.PI * 1.85); c.stroke(); }
    c.save(); c.translate(-cam, 0);
    for (const pl of this.pl) {
      if (pl.x + pl.w < cam - 60 || pl.x > cam + VW + 60) continue;
      const bob = pl.bob > 0 ? Math.sin(pl.bob * Math.PI) * 5 : 0;
      if (pl.type === 'ground') { rr(c, pl.x, pl.y, pl.w, 200, 30); fs(c, '#d9b98a'); rr(c, pl.x - 6, pl.y - 6, pl.w + 12, 34, 17); fs(c, '#8fd67f', '#74c067', 2); }
      else if (pl.type === 'pad') { ell(c, pl.x + pl.w / 2, pl.y + 12 + bob, pl.w / 2 + 6, 16); fs(c, '#58b964'); c.beginPath(); c.ellipse(pl.x + pl.w / 2, pl.y + 7 + bob, pl.w / 2 + 6, 14, 0, 0.25, TAU - 0.1); c.lineTo(pl.x + pl.w / 2, pl.y + 7 + bob); c.closePath(); fs(c, '#7ed56f', '#58b964', 2); if (pl.amp) { c.strokeStyle = 'rgba(255,255,255,0.8)'; c.lineWidth = 3; const dx = Math.cos(this.t * 1.5 + pl.ph) > 0 ? 1 : -1; line(c, pl.x + pl.w / 2 - dx * (pl.w / 2 + 14), pl.y + 22, pl.x + pl.w / 2 - dx * (pl.w / 2 + 34), pl.y + 22); } else if (pl.w > 135) { c.fillStyle = '#ff9ecb'; sparklePath(c, pl.x + pl.w - 22, pl.y + 2 + bob, 10); c.fill(); c.fillStyle = '#fff3a0'; circ(c, pl.x + pl.w - 22, pl.y + 2 + bob, 3); c.fill(); } }
      else { rr(c, pl.x - 4, pl.y, pl.w + 8, 80, 22); fs(c, '#c9c9d6', '#a8a8b8', 2); c.fillStyle = 'rgba(255,255,255,0.5)'; rr(c, pl.x + 10, pl.y + 6, pl.w * 0.4, 7, 4); c.fill(); }
      if (pl.spring) { const q = pl.boing > 0 ? Math.sin(pl.boing * Math.PI * 3) * 0.3 * pl.boing : 0; c.save(); c.translate(pl.x + pl.w / 2, pl.y + 2); c.scale(1.9 * (1 + q), 1.9 * (1 - q)); drawMushroom(c, { x: 0, y: 0, col: '#ff6b6b', squish: 0 }); c.restore(); }
    }
    // Ziel: Blumentor und Frosch
    const gx = this.endX + 250;
    c.strokeStyle = '#84d48f'; c.lineWidth = 12; c.beginPath(); c.arc(gx, 400, 96, Math.PI, 0); c.stroke();
    for (let i = 0; i <= 8; i++) { const a = Math.PI + i * Math.PI / 8; drawFlower(c, { x: gx + Math.cos(a) * 96, y: 400 + Math.sin(a) * 96, col: PASTEL[i % 5], r: i }); }
    drawActor(c, 'frog', gx, 400, { size: 92, t, lift: this.winT >= 0 ? Math.abs(Math.sin(t * 9)) * 30 : Math.abs(Math.sin(t * 2.5)) * 5 });
    for (const s of this.stars) { if (s.got || s.x < cam - 40 || s.x > cam + VW + 40) continue; const y = s.y + Math.sin(t * 3 + s.x) * 5; c.fillStyle = 'rgba(255,243,160,0.45)'; circ(c, s.x, y, 26); c.fill(); starPath(c, s.x, y, 19, 5, 0.5, -Math.PI / 2 + Math.sin(t * 2 + s.x) * 0.2); fs(c, '#ffd54a', '#f0b429', 2.5); }
    drawCloud(c, this.uni.x, this.uni.y + 6, 0.62); drawActor(c, 'unicorn', this.uni.x, this.uni.y, { size: 66, t, flip: p.face < 0, noShadow: true, mark: uniMark(), glow: this.hintT > 0, lift: this.winT >= 0 ? Math.abs(Math.sin(t * 8)) * 16 : 0 });
    if (this.respawn <= 0) drawActor(c, 't', p.x, p.y, { size: 88, t, walk: p.moving && p.ground, flip: p.face < 0, noShadow: !p.ground, lift: this.winT >= 0 ? Math.abs(Math.sin(t * 8)) * 22 : 0 });
    c.restore();
    c.fillStyle = 'rgba(143,208,240,0.45)'; c.fillRect(0, W + 34, VW, VH - W - 34);
    this.fx.draw(c);
    // Sterne-Anzeige und Weg-Fortschritt
    const n = this.stars.length, sw = Math.min(30, (VW - 330) / n), sx = VW / 2 - (n - 1) * sw / 2;
    rr(c, sx - 24, 14, (n - 1) * sw + 48, 42, 21); fs(c, 'rgba(255,255,255,0.7)');
    for (let i = 0; i < n; i++) { starPath(c, sx + i * sw, 35, sw * 0.42); fs(c, i < this.got ? '#ffd54a' : 'rgba(255,255,255,0.9)', i < this.got ? '#f0b429' : '#d6cfe6', 2); }
    const prog = clamp(p.x / (this.endX + 170), 0, 1), px0 = VW / 2 - 140;
    rr(c, px0, 64, 280, 12, 6); fs(c, 'rgba(255,255,255,0.6)'); rr(c, px0, 64, 280 * prog, 12, 6); fs(c, '#7ed56f');
    drawActor(c, 'frog', px0 + 292, 80, { size: 24, t, noShadow: true });
    // Knöpfe
    const B = this.btns(), P = this.pressed || {}, teachMove = this.teach > 3.5, teachJump = this.teach > 0 && this.teach <= 3.5, hj = this.hintT > 0;
    c.globalAlpha = 0.92;
    drawRoundBtn(c, B.l.x, B.l.y, B.l.r, { color: '#9ecbff', icon: 'left', pressed: P.left });
    drawRoundBtn(c, B.r.x, B.r.y, B.r.r, { color: '#9ecbff', icon: 'right', pressed: P.right, pulse: teachMove || hj, glow: teachMove || hj });
    drawRoundBtn(c, B.j.x, B.j.y, B.j.r, { color: '#ffb65c', icon: 'up', pressed: P.jump, pulse: teachJump || hj, glow: teachJump || hj });
    c.globalAlpha = 1;
    drawMiniExit(c);
  },
  down(p) { const e = miniExit(); if (hit(p, e.x, e.y, e.r + 6)) { Sfx.play('tap'); Game.go(World, { from: 'frog' }); } }
};

/* ---------- Drache: Fangen spielen ----------
   Der Drache schaut aus Büschen heraus, T tippt ihn an. spots = Büsche, show = Sekunden sichtbar,
   goal = so oft fangen, bunny = Anteil Hasen (Antippen schadet nicht), double = manchmal Drache und Hase zugleich */
const DRAGON_LEVELS = [
  { spots: 4, show: 2.4, goal: 6, bunny: 0, pause: [0.5, 1.0], double: 0 },
  { spots: 6, show: 1.7, goal: 9, bunny: 0.3, pause: [0.4, 0.9], double: 0 },
  { spots: 8, show: 1.25, goal: 12, bunny: 0.35, pause: [0.3, 0.7], double: 0.35 }
];
const DragonGame = {
  id: 'dragon',
  enter() {
    this.lv = miniLevel('dragon'); this.d = DRAGON_LEVELS[this.lv];
    this.t = 0; this.winT = -1; this.got = 0; this.pops = []; this.wait = 2.2; this.idle = 0; this.hintT = 0; this.slow = 1; this.miss = 0; this.last = -1; this.bunnies = 0;
    this.fx = new Fx(); this.bush = Array.from({ length: this.d.spots }, () => ({ shake: 0, peek: 0 }));
    Voice.say(['dragon_intro', 'dragon_intro2', 'dragon_intro3'][this.lv], { pitch: 1.6 });
  },
  layout() {
    const n = this.d.spots, rows = n > 4 ? 2 : 1, per = Math.ceil(n / rows), sp = Math.min(240, (VW - 250) / Math.max(1, per - 1)), s = rows === 1 ? 1.55 : 1.3;
    const spots = []; for (let r = 0; r < rows; r++) for (let k = 0; k < per && spots.length < n; k++) spots.push({ x: VW / 2 + 20 + (k - (per - 1) / 2) * sp + (r ? sp * 0.18 : -sp * 0.18) * (rows - 1), y: rows === 1 ? 390 : r === 0 ? 270 : 450, s });
    return { spots, uni: { x: 62, y: VH - 10 } };
  },
  spawn() {
    const n = this.d.spots, pickSpot = ex => { let k; do { k = Math.floor(Math.random() * n); } while (ex.includes(k)); return k; };
    const bunny = this.bunnies < 2 && Math.random() < this.d.bunny, stay = this.d.show * this.slow * (this.hintT > 0 ? 1.7 : 1);
    const used = [this.last];
    const add = who => { const k = pickSpot(used); used.push(k); this.pops.push({ spot: k, who, t: 0, rise: 0.22, stay: who === 'bunny' ? stay * 0.9 : stay, caught: false }); return k; };
    if (bunny) { this.bunnies++; add('bunny'); if (Math.random() < this.d.double) this.last = add('dragon'); }
    else { this.bunnies = 0; this.last = add('dragon'); if (Math.random() < this.d.double * 0.6) add('bunny'); }
  },
  popP(o) { return o.t < o.rise ? o.t / o.rise : o.t < o.rise + o.stay ? 1 : Math.max(0, 1 - (o.t - o.rise - o.stay) / o.rise); },
  update(dt) {
    this.t += dt; this.fx.update(dt); if (this.hintT > 0) this.hintT -= dt;
    for (const b of this.bush) { if (b.shake > 0) b.shake -= dt * 2.5; }
    for (const o of this.pops) o.t += dt;
    this.pops = this.pops.filter(o => {
      if (o.t < o.rise * 2 + o.stay) return true;
      if (o.who === 'dragon' && !o.caught && this.winT < 0) { this.miss++; if (this.miss >= 2) { this.miss = 0; this.slow = Math.min(2, this.slow * 1.2); } }
      return false;
    });
    if (this.winT >= 0) { this.winT += dt; if (this.winT > 3) finishMini('dragon'); return; }
    if (!this.pops.length) { this.wait -= dt; if (this.wait <= 0) { this.spawn(); this.wait = rnd(this.d.pause[0], this.d.pause[1]); } }
    this.idle += dt; if (this.idle > CONFIG.hintDelay) { this.idle = 0; this.hintT = 8; this.slow = Math.min(2, this.slow * 1.25); Sfx.play('hint'); Voice.say('dragon_hint'); }
  },
  hitPop(p, L) {
    for (const o of this.pops) {
      const sp = L.spots[o.spot], pp = this.popP(o); if (pp < 0.35 || o.caught) continue;
      if (dist(p.x, p.y, sp.x, sp.y - 72 * sp.s * pp) < 64 * sp.s) return o;
    }
    return null;
  },
  draw(c) {
    const L = this.layout(), t = this.t;
    drawMeadow(c, t);
    drawTree(c, { x: 70, y: VH - 150, s: 1.3, kind: 0, shake: 0 }, t); drawTree(c, { x: VW - 80, y: VH - 160, s: 1.4, kind: 1, shake: 0 }, t);
    // Wer gerade aus welchem Busch schaut
    L.spots.forEach((sp, k) => {
      const b = this.bush[k], sh = b.shake > 0 ? Math.sin(t * 50) * 5 * b.shake : 0;
      c.save(); c.beginPath(); c.rect(sp.x - 120 * sp.s, 0, 240 * sp.s, sp.y - 12 * sp.s); c.clip();
      for (const o of this.pops) if (o.spot === k) {
        const pp = this.popP(o), rise = (1 - easeOut(pp)) * 110 * sp.s;
        if (o.who === 'dragon') {
          drawActor(c, 'dragon', sp.x, sp.y - 36 * sp.s + rise, { size: 72 * sp.s, t, noShadow: true, flip: k % 2 === 0, happy: true });
          if (o.caught) for (let i = 0; i < 3; i++) { const a = t * 6 + i * 2.1; c.fillStyle = '#ffd54a'; starPath(c, sp.x + Math.cos(a) * 34 * sp.s, sp.y - 100 * sp.s + rise + Math.sin(a) * 10, 8); c.fill(); }
        } else drawBunnyHead(c, sp.x + 4, sp.y - 34 * sp.s + rise, sp.s * 1.25, t);
      }
      c.restore();
      c.save(); c.translate(sp.x + sh, sp.y); c.scale(sp.s, sp.s); drawBush(c, { x: 0, y: 0, shake: 0, peek: 0 }, t); c.restore();
      if (this.hintT > 0) for (const o of this.pops) if (o.spot === k && o.who === 'dragon' && !o.caught && this.popP(o) > 0.5) { c.strokeStyle = 'rgba(255,213,74,' + (0.6 + Math.sin(t * 10) * 0.3) + ')'; c.lineWidth = 6; circ(c, sp.x, sp.y - 78 * sp.s, 58 * sp.s); c.stroke(); drawSparkleLine(c, L.uni.x + 40, L.uni.y - 100, sp.x, sp.y - 78 * sp.s, t); }
    });
    if (this.winT >= 0) drawActor(c, 'dragon', VW / 2, VH / 2 + 60, { size: 130, t, lift: Math.abs(Math.sin(t * 8)) * 40, fly: true, noShadow: true });
    // Fortschritt
    const n = this.d.goal, sw = Math.min(40, (VW - 330) / n), sx = VW / 2 - (n - 1) * sw / 2;
    rr(c, sx - 26, 14, (n - 1) * sw + 52, 46, 23); fs(c, 'rgba(255,255,255,0.75)');
    for (let i = 0; i < n; i++) { starPath(c, sx + i * sw, 37, sw * 0.42); fs(c, i < this.got ? '#ffd54a' : 'rgba(255,255,255,0.9)', i < this.got ? '#f0b429' : '#d6cfe6', 2); }
    drawActor(c, 'unicorn', L.uni.x, L.uni.y, { size: 96, t, lift: this.winT >= 0 ? Math.abs(Math.sin(t * 8)) * 26 : 0, mark: uniMark(), glow: this.hintT > 0 });
    this.fx.draw(c);
    drawMiniExit(c);
  },
  down(p) {
    const e = miniExit(); if (hit(p, e.x, e.y, e.r + 6)) { Sfx.play('tap'); Game.go(World, { from: 'dragon' }); return; }
    if (this.winT >= 0) return;
    const L = this.layout(), o = this.hitPop(p, L);
    if (o && o.who === 'dragon') {
      o.caught = true; o.t = Math.max(o.t, o.rise + o.stay); this.got++; this.idle = 0; this.hintT = 0; this.miss = 0; this.slow = Math.max(1, this.slow * 0.95);
      const sp = L.spots[o.spot]; this.fx.burst(sp.x, sp.y - 70 * sp.s, 16, { g: 120 }); Sfx.play('star'); Sfx.play('giggle');
      if (this.got >= this.d.goal) { this.pops = []; miniWin(this); Voice.say('dragon_caught', { pitch: 1.6, queue: true }); }
      else if (this.got % 2 === 0) Voice.say('dragon_caught', { pitch: 1.6 });
      return;
    }
    if (o && o.who === 'bunny') { o.t = Math.max(o.t, o.rise + o.stay); Sfx.play('hop'); const sp = L.spots[o.spot]; this.fx.burst(sp.x, sp.y - 60 * sp.s, 6, { shape: 'heart', color: '#ff9ecb', g: -40, sp1: 70 }); if (Math.random() < 0.5) Voice.say('dragon_bunny'); return; }
    L.spots.forEach((sp, k) => { if (dist(p.x, p.y, sp.x, sp.y - 30 * sp.s) < 60 * sp.s) { this.bush[k].shake = 1; Sfx.play('rustle'); } });
    if (hit(p, L.uni.x, L.uni.y - 50, 56)) { this.hintT = 8; Sfx.play('hint'); }
  }
};

const MINIGAMES = { owl: OwlGame, fox: FoxGame, frog: FrogGame, dragon: DragonGame };

/* ============ 7. START ============ */
function drawRotateHint(c) {
  // Hochformat: Bild "Handy drehen" (ohne Text)
  c.setTransform(1, 0, 0, 1, 0, 0); c.fillStyle = '#aee3ff'; c.fillRect(0, 0, canvas.width, canvas.height);
  const s = Math.min(canvas.width, canvas.height) / 300, a = (Math.sin(Game.time * 2.4) * 0.5 + 0.5) * Math.PI / 2;
  c.translate(canvas.width / 2, canvas.height / 2); c.scale(s, s);
  c.save(); c.rotate(a); rr(c, -38, -66, 76, 132, 14); fs(c, '#fff', '#7a5cc9', 6); rr(c, -28, -50, 56, 96, 6); fs(c, '#ffd9f1'); c.fillStyle = '#ffd54a'; starPath(c, 0, -2, 18); c.fill(); c.restore();
  c.strokeStyle = '#7a5cc9'; c.lineWidth = 7; c.lineCap = 'round'; c.beginPath(); c.arc(0, 0, 104, -1.9, -0.5); c.stroke();
  tri(c, 91, -62, 104, -38, 78, -44); fs(c, '#7a5cc9', '#7a5cc9', 4);
}
let lastFrame = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, Math.max(0, (now - lastFrame) / 1000)); lastFrame = now;
  try {
    if (View.portrait) { Game.time += dt; drawRotateHint(ctx); return; }
    Game.update(dt);
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.fillStyle = '#2b3a55'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(View.scale, 0, 0, View.scale, View.ox, View.oy);
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, VW, VH); ctx.clip();
    Game.draw(ctx);
    ctx.restore();
  } catch (err) {
    // Ein Fehler soll das Spiel nie einfrieren: melden und weiterlaufen
    if (window.console) console.error(err);
    window.__zwErrors = (window.__zwErrors || 0) + 1;
    try { ctx.restore(); } catch (e) {}
  }
}
function boot() {
  Save.load(); Sprites.load(); Voice.init(); initInput();
  Game.scene = StartScene; StartScene.enter({});
  View.resize();
  window.addEventListener('resize', () => View.resize());
  window.addEventListener('orientationchange', () => setTimeout(() => View.resize(), 200));
  document.addEventListener('visibilitychange', () => { if (document.hidden) Voice.stop(); lastFrame = performance.now(); });
  window.ZW = { CONFIG, SPEECH, Game, Save, View, Input, World, StartScene, NamingScene, OwlGame, FoxGame, FrogGame, DragonGame, NPCS, Voice }; // zum Testen in der Konsole
  lastFrame = performance.now(); requestAnimationFrame(frame);
}
boot();
